<!doctype html>
<html lang="ko" data-ui data-theme="auto" data-layout="bar">
<head>
<meta charset="utf-8">
<script>/* theme before first paint: auto (follow the OS) | light | dark */
try { const t = localStorage.getItem("lab.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labsidian</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#6155F5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=64">
<link rel="stylesheet" href="features.css?v=80">
<link rel="stylesheet" href="tokens.css?v=9">
<link rel="stylesheet" href="apple.css?v=13">
<link rel="stylesheet" href="layout.css?v=4">
<script type="importmap">
{
  "imports": {
    "graphology": "https://cdn.jsdelivr.net/npm/graphology@0.26.0/+esm",
    "sigma": "https://cdn.jsdelivr.net/npm/sigma@3.0.3/+esm",
    "sigma/rendering": "https://cdn.jsdelivr.net/npm/sigma@3.0.3/rendering/+esm",
    "@sigma/node-border": "https://cdn.jsdelivr.net/npm/@sigma/node-border@3.0.0/+esm",
    "d3-contour": "https://cdn.jsdelivr.net/npm/d3-contour@4.0.2/+esm",
    "d3-force": "https://cdn.jsdelivr.net/npm/d3-force@3.0.0/+esm"
  }
}
</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#/home"><img class="logo-mark" src="logo.svg" alt="">Labsidian</a>
  <nav id="nav">
    <a href="#/home" data-view="home"><i data-lucide="house" class="ic"></i><span data-i18n="nav.home"></span></a>
    <a href="#/graph" data-view="graph"><i data-lucide="waypoints" class="ic"></i><span data-i18n="nav.graph"></span></a>
    <a href="#/people" data-view="people"><i data-lucide="users" class="ic"></i><span data-i18n="nav.people"></span></a>
    <a href="#/papers" data-view="papers"><i data-lucide="file-text" class="ic"></i><span data-i18n="nav.papers"></span></a>
    <a href="#/study" data-view="study"><i data-lucide="book-open" class="ic"></i><span data-i18n="nav.study"></span></a>
  </nav>
  <button class="icon-btn search-btn" id="search-btn" type="button" data-i18n-title="sp.btn"><i data-lucide="search" class="ic"></i></button>
  <div class="lang seg" id="lang"><button data-v="ko">KO</button><button data-v="en">EN</button></div>
</header>

<main>
  <section id="view-graph" class="view">
    <canvas id="regions"></canvas>
    <div id="graph"></div>
    <div id="cluster-labels"></div>

    <!-- top toolbar: search + filter buttons (each opens a popover) -->
    <div class="g-toolbar" id="g-toolbar">
      <div class="tb-search">
        <input id="g-find" type="search" data-i18n-ph="g.find.ph" autocomplete="off">
        <div id="g-find-results" class="find-results" hidden></div>
      </div>
      <button class="tb-btn" id="tb-field" data-pop="pop-field"><span data-i18n="g.tags"></span><span class="n"></span><span class="caret">▾</span></button>
      <button class="tb-btn" id="tb-venue" data-pop="pop-venue"><span data-i18n="g.venues"></span><span class="n"></span><span class="caret">▾</span></button>
      <button class="tb-btn" id="tb-year" data-pop="pop-year"><span data-i18n="g.year"></span><span class="n"></span><span class="caret">▾</span></button>
      <button class="tb-btn" id="tb-more" data-pop="pop-more"><span data-i18n="g.more"></span><span class="n"></span><span class="caret">▾</span></button>
      <button class="link-btn" id="tb-reset" hidden data-i18n="g.reset"></button>
      <span class="tb-count muted" id="g-count"></span>
    </div>

    <div class="pop" id="pop-field" hidden>
      <div class="pop-h" data-i18n="g.tags"></div><div class="chips dom"></div>
      <div class="pop-h" data-i18n="g.methods"></div><div class="chips met"></div>
    </div>
    <div class="pop" id="pop-venue" hidden>
      <div class="pop-h" data-i18n="g.venueType"></div><div class="chips"></div>
      <div class="pop-h" data-i18n="g.venues"></div>
      <input id="venue-q" type="search" data-i18n-ph="g.venueSearch" autocomplete="off">
      <div class="checklist"></div>
    </div>
    <div class="pop" id="pop-year" hidden>
      <div class="pop-h"><span data-i18n="g.year"></span> <b id="f-year-v"></b></div>
      <div class="dual"><input type="range" id="f-year-min"><input type="range" id="f-year-max"></div>
      <label class="check"><input type="checkbox" id="f-year-unknown" checked> <span data-i18n="g.yearUnknown"></span></label>
    </div>
    <div class="pop" id="pop-more" hidden>
      <div class="pop-row"><span data-i18n="g.rating"></span>
        <div class="seg small" id="f-rating"><button data-v="0" class="on">-</button><button data-v="3">★3</button><button data-v="4">★4</button></div></div>
      <label class="check"><input type="checkbox" id="f-shared"> <span data-i18n="g.sharedOnly"></span></label>
      <div class="pop-row"><span data-i18n="g.filterMode"></span>
        <div class="seg small" id="f-mode"><button data-v="dim" class="on" data-i18n="g.mode.dim"></button><button data-v="hide" data-i18n="g.mode.hide"></button></div></div>
    </div>

    <!-- bottom-left: people legend (= colour key + person filter) -->
    <div class="g-people" id="g-people"></div>

    <!-- bottom-right: zoom + settings -->
    <div class="g-corner">
      <button class="icon-btn" id="z-in" title="+">+</button>
      <button class="icon-btn" id="z-out" title="-">−</button>
      <button class="icon-btn" id="z-fit" data-i18n-title="g.fit">⤢</button>
      <button class="icon-btn" id="tb-settings" data-pop="pop-settings" data-i18n-title="g.settings">⚙</button>
    </div>
    <div class="pop pop-settings" id="pop-settings" hidden>
      <div class="pop-h" data-i18n="g.colorBy"></div>
      <div class="seg small" id="g-colorby"><button data-v="person" class="on" data-i18n="g.color.first"></button><button data-v="year" data-i18n="g.color.year"></button><button data-v="venue" data-i18n="g.color.venue"></button></div>
      <div class="pop-h" data-i18n="g.layers"></div>
      <label class="check"><input type="checkbox" id="l-links"> <span data-i18n="g.l.readLinks"></span></label>
      <label class="check"><input type="checkbox" id="l-regions"> <span data-i18n="g.l.regions"></span></label>
      <label class="check"><input type="checkbox" id="l-labels"> <span data-i18n="g.l.labels"></span></label>
      <label class="check"><input type="checkbox" id="l-timeline"> <span data-i18n="g.l.timeline"></span></label>
      <div class="pop-h"><span data-i18n="g.physics"></span><button class="link-btn" id="ph-reset" data-i18n="g.reset"></button></div>
      <label class="slider"><span data-i18n="g.ph.repel"></span><input type="range" id="ph-repel"></label>
      <label class="slider"><span data-i18n="g.ph.link"></span><input type="range" id="ph-link"></label>
      <label class="slider"><span data-i18n="g.ph.anchor"></span><input type="range" id="ph-anchor"></label>
      <p class="hint" data-i18n="g.umapNote"></p>
    </div>

    <div class="focus-bar" id="focus-bar" hidden>
      <span class="muted" data-i18n="g.focus"></span>
      <b id="focus-name"></b>
      <span class="muted" data-i18n="g.depth"></span>
      <div class="seg small" id="focus-depth"><button data-v="1" class="on">1</button><button data-v="2">2</button></div>
      <button class="link-btn" id="focus-clear" data-i18n="g.clear"></button>
    </div>

    <div class="timeline" hidden>
      <button id="t-play" class="play" aria-label="play">▶</button>
      <input type="range" id="t-range">
      <span id="t-label" class="muted"></span>
    </div>
  </section>

  <section id="view-people" class="view page">
    <div class="page-head">
      <h1 data-i18n="people.title"></h1>
      <p class="sub" id="people-sub"></p>
    </div>
    <div id="lab-bars" class="pp-head"></div>
    <div id="people-grid" class="pp-grid"></div>
  </section>

  <section id="view-papers" class="view page">
    <div class="tabs papers-tabs"><a href="#/papers" class="on" data-i18n="pt.list"></a><a href="#/topics" data-i18n="pt.topics"></a><a href="#/guides" data-i18n="pt.guides"></a></div>
    <div class="page-head">
      <h1 data-i18n="papers.title"></h1>
      <p class="sub" id="papers-sub"></p>
    </div>
    <div class="filters">
      <div class="p-search"><i data-lucide="search" class="ic"></i><input id="p-search" type="search" data-i18n-ph="papers.search.ph" autocomplete="off"></div>
      <select id="f-topic"></select>
      <select id="f-person"></select>
      <select id="f-minrating"></select>
      <select id="f-sort"></select>
    </div>
    <div id="paper-list" class="list"></div>
  </section>

</main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-tools"><a class="drawer-btn" id="drawer-expand" hidden data-i18n-title="d.fullPage">⤢</a><button class="drawer-btn" id="drawer-close" data-i18n-title="close">✕</button></div>
  <div id="drawer-body"></div>
</aside>
<div id="tooltip" class="tooltip"></div>

<script src="i18n.js?v=70"></script>
<script src="data.js?v=71"></script>
<script src="store.js?v=73"></script>
<script src="app.js?v=74"></script>
<script src="auth.js?v=73"></script>
<script src="social.js?v=68"></script>
<script src="write.js?v=68"></script>
<script src="me.js?v=69"></script>
<script src="reading.js?v=1"></script>
<script src="viz.js?v=6"></script>
<script src="people.js?v=4"></script>
<script src="topics.js?v=2"></script>
<script src="guides.js?v=3"></script>
<script src="admin.js?v=68"></script>
<script src="home.js?v=69"></script>
<script src="study.js?v=71"></script>
<script src="design.js?v=68"></script>
<script src="spotlight.js?v=1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@1.49.0/dist/umd/lucide.min.js"></script>
<script type="module" src="graph.js?v=69"></script>
</body>
</html>
